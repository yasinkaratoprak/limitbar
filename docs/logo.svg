<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="limitbar">
  <title>limitbar</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3a"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
  </defs>

  <!-- Tile, with a faint edge so it separates from GitHub's dark background -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#e6edf3" stroke-opacity="0.14" stroke-width="8"/>

  <!-- Terminal prompt -->
  <path d="M116 112 L188 156 L116 200" fill="none" stroke="#e6edf3" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="168" width="96" height="34" rx="12" fill="#e6edf3"/>

  <!-- Session limit: plenty left -->
  <rect x="100" y="252" width="312" height="72" rx="36" fill="#e6edf3" fill-opacity="0.18"/>
  <rect x="100" y="252" width="232" height="72" rx="36" fill="#34d399"/>

  <!-- Weekly limit: getting low -->
  <rect x="100" y="348" width="312" height="72" rx="36" fill="#e6edf3" fill-opacity="0.18"/>
  <rect x="100" y="348" width="128" height="72" rx="36" fill="#fbbf24"/>
</svg>
