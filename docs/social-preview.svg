<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="limitbar: AI usage limits in your terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232b3a"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Logo -->
  <g transform="translate(180 176) scale(0.5625)">
    <rect width="512" height="512" rx="112" fill="url(#tile)"/>
    <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#e6edf3" stroke-opacity="0.14" stroke-width="8"/>
    <path d="M116 112 L188 156 L116 200" fill="none" stroke="#e6edf3" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="168" width="96" height="34" rx="12" fill="#e6edf3"/>
    <rect x="100" y="252" width="312" height="72" rx="36" fill="#e6edf3" fill-opacity="0.18"/>
    <rect x="100" y="252" width="232" height="72" rx="36" fill="#34d399"/>
    <rect x="100" y="348" width="312" height="72" rx="36" fill="#e6edf3" fill-opacity="0.18"/>
    <rect x="100" y="348" width="128" height="72" rx="36" fill="#fbbf24"/>
  </g>

  <g font-family="'DejaVu Sans', Helvetica, Arial, sans-serif">
    <text x="516" y="300" font-size="96" font-weight="700" fill="#e6edf3">limitbar</text>
    <text x="520" y="364" font-size="34" fill="#9da7b3">AI usage limits in your terminal</text>
  </g>
  <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="26">
    <text x="520" y="440" fill="#34d399">Codex · Claude · Antigravity · Gemini</text>
  </g>
</svg>
