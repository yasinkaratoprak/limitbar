[package]
name = "limitbar"
version = "0.1.0"
edition = "2024"
description = "AI usage limits for Codex, Claude, Antigravity and Gemini in the terminal"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.9", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
